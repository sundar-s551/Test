name: zAppBuild
profiles: 
    - name: dbb-userbuild
      type: dbb
      settings:
        application: .
        command: /z/z84486/run-build.sh
        buildScriptPath: /z/z84486/dbb-zappbuild/build.groovy
        buildScriptArgs:
          - --userBuild
          - --workspace ${dbbWorkspace}
          - --application ${application}
          - --hlq ${dbbHlq}
          - --outDir ${dbbLogDir}
          - --dependencyFile ${dependencyFile}
        additionalDependencies:
          - application-conf
        logFilePatterns:
          - ${buildFile.basename}.log
          - BuildReport.*
  